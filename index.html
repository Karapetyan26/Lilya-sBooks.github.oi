<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 Книжный Квест</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="book-container">
    <div class="profile-panel">
      <div class="profile-info">
        <span class="profile-title">Статус:</span>
        <span id="profileStatus" class="profile-status">Невежда</span>
      </div>
      <div class="profile-stars"><span id="starsCount">0</span> ⭐</div>
    </div>

    <div id="menuScreen" class="screen active">
      <h1>📖 Книжный Квест</h1>
      <p class="subtitle">Выбери серию книг и проверь свои знания!</p>
      <p class="subtitle hint">🎯 Угадай минимум <b>5 из 10</b> вопросов, чтобы победить</p>
      
      <div class="book-list">
        <button class="book-card" data-book="kamora">
          <span class="book-icon">🗡️</span><span class="book-title">Хроники Каморры (Кора Рейли)</span>
        </button>
        <button class="book-card" data-book="bratva">
          <span class="book-icon">🔪</span><span class="book-title">Мясник Братвы (Т. Дж. Магуайр)</span>
        </button>
        <button class="book-card" data-book="monstra">
          <span class="book-icon">👹</span><span class="book-title">Монстра (Рина Кент)</span>
        </button>
        <button class="book-card" data-book="nightdevil">
          <span class="book-icon">😈</span><span class="book-title">Ночь Дьявола (Пенелопа Дуглас)</span>
        </button>
        <button class="book-card" data-book="godofwrath">
          <span class="book-icon">🔥</span><span class="book-title">Бог Гнева (Рина Кент)</span>
        </button>
      </div>
    </div>

    <div id="quizScreen" class="screen">
      <div class="page-header">
        <button id="backBtn" class="back-btn">← Назад</button>
        <span id="bookName" class="book-name"></span>
        <span class="question-counter"><span id="currentQ">1</span>/<span id="totalQ">10</span></span>
      </div>
      <div class="win-progress-bar">
        <span class="win-progress-label">До победы:</span>
        <span id="winProgress">0</span> / <span id="winNeeded">5</span>
        <div class="win-progress-track"><div id="winProgressFill" class="win-progress-fill"></div></div>
      </div>
      <div class="page">
        <div class="page-corner"></div>
        <h2 id="questionText" class="question-text"></h2>
        <div id="answersContainer" class="answers"></div>
        <div id="feedback" class="feedback"></div>
      </div>
    </div>

    <div id="resultScreen" class="screen">
      <h1 id="resultTitle">🏆 Результат</h1>
      <p class="result-text" id="resultText"></p>
      <div class="result-stars" id="resultStars"></div>
      <p class="result-verdict" id="resultVerdict"></p>
      <div class="result-buttons">
        <button id="retryBtn" class="restart-btn">🔄 Пройти ещё раз</button>
        <button id="restartBtn" class="restart-btn secondary">🏠 В главное меню</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
